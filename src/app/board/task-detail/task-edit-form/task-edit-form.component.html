<form id="taskEditForm" class="editForm" novalidate (submit)="submit($event)">
  <div class="formGroup">
    <label class="label" for="editTitle">Title<span class="required">*</span></label>
    <input
      id="editTitle"
      class="input"
      name="title"
      type="text"
      placeholder="Enter a title"
      autocomplete="off"
      [class.errorInput]="errors().title !== ''"
      [value]="values().title"
      (input)="onInput('title', $event)"
      (blur)="onBlur('title')"
    />
    <span class="errorText" role="alert">{{ errors().title }}</span>
  </div>

  <div class="formGroup">
    <label class="label" for="editDescription">Description</label>
    <textarea
      id="editDescription"
      class="input textarea"
      name="description"
      placeholder="Enter a Description"
      [value]="values().description"
      (input)="onInput('description', $event)"
    ></textarea>
  </div>

  <div class="formGroup">
    <label class="label" for="editDueDate">Due date<span class="required">*</span></label>
    <input
      id="editDueDate"
      class="input dateInput"
      name="dueDate"
      type="date"
      [class.empty]="!values().dueDate"
      [class.errorInput]="errors().dueDate !== ''"
      [min]="minDate"
      [value]="values().dueDate"
      (input)="onInput('dueDate', $event)"
      (click)="openDatePicker($event)"
      (blur)="onBlur('dueDate')"
    />
    <span class="errorText" role="alert">{{ errors().dueDate }}</span>
  </div>

  <div class="formGroup">
    <span class="label prioLabel" id="editPrioLabel">Priority</span>
    <div class="prioButtons" role="radiogroup" aria-labelledby="editPrioLabel">
      @for (option of prioOptions; track option.value) {
        <button
          class="prioButton"
          type="button"
          role="radio"
          [class]="option.icon"
          [class.active]="values().prio === option.value"
          [attr.aria-checked]="values().prio === option.value"
          (click)="selectPrio(option.value)"
        >
          {{ option.value }}
          <img
            [src]="
              'assets/icons/priority/' +
              (values().prio === option.value ? option.activeIcon : option.icon) +
              '.svg'
            "
            alt=""
          />
        </button>
      }
    </div>
  </div>

  <div class="formGroup">
    <span class="label" id="editAssignedToLabel">Assigned to</span>
    <app-assigned-to-select
      aria-labelledby="editAssignedToLabel"
      [selectedIds]="values().assignedTo"
      (selectedIdsChange)="onAssignedChange($event)"
    />
  </div>

  <div class="formGroup">
    <span class="label" id="editSubtasksLabel">Subtasks</span>
    <app-subtasks-input
      aria-labelledby="editSubtasksLabel"
      [subtasks]="values().subtasks"
      (subtasksChange)="onSubtasksChange($event)"
    />
  </div>
</form>
