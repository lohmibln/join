<form class="editForm" novalidate>
  <div class="formGroup">
    <label class="label" for="editTitle">Title<span class="required">*</span></label>
    <input
      id="editTitle"
      class="input"
      name="title"
      type="text"
      placeholder="Enter a title"
      autocomplete="off"
      [class.errorInput]="errors().title !== ''"
      [value]="values().title"
      (input)="onInput('title', $event)"
      (blur)="onBlur('title')"
    />
    <span class="errorText" role="alert">{{ errors().title }}</span>
  </div>

  <div class="formGroup">
    <label class="label" for="editDescription">Description</label>
    <textarea
      id="editDescription"
      class="input textarea"
      name="description"
      placeholder="Enter a Description"
      [value]="values().description"
      (input)="onInput('description', $event)"
    ></textarea>
  </div>
  <div class="formGroup">
    <label class="label" for="editDueDate">Due date<span class="required">*</span></label>
    <input
      id="editDueDate"
      class="input"
      name="dueDate"
      type="date"
      [class.errorInput]="errors().dueDate !== ''"
      [min]="minDate"
      [value]="values().dueDate"
      (input)="onInput('dueDate', $event)"
      (click)="openDatePicker($event)"
      (blur)="onBlur('dueDate')"
    />
    <span class="errorText" role="alert">{{ errors().dueDate }}</span>
  </div>
</form>
