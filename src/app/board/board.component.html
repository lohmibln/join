<section class="board">
  <h1>Board</h1>

  <div class="columns">
    @for (column of columns; track column.status) {
      <div class="column">
        <h2 class="columnTitle">{{ column.title }}</h2>

        @if (tasksOf(column.status).length === 0) {
          <p class="noTasks">No tasks {{ column.title }}</p>
        }
      </div>
    }
  </div>
</section>
