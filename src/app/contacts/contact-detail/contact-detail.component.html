<div class="header">
  <span class="avatar" [style.background-color]="color()">{{ contact().name_shortcut }}</span>
  <div class="info">
    <h2 class="name">{{ contact().full_name }}</h2>
    <div class="actions" [class.open]="isMenuOpen()">
      <button class="actionButton editButton" type="button" (click)="editContact.emit()">
        <span class="actionIcon"></span>
        Edit
      </button>
      <button class="actionButton deleteButton" type="button" (click)="deleteContact.emit()">
        <span class="actionIcon"></span>
        Delete
      </button>
    </div>
  </div>
</div>

<section class="contactInfo">
  <h3 class="infoTitle">Contact Information</h3>
  <div class="infoRow">
    <span class="infoLabel">Email</span>
    <a class="infoEmail" [href]="'mailto:' + contact().email">{{ contact().email }}</a>
  </div>
  <div class="infoRow">
    <span class="infoLabel">Phone</span>
    <a class="infoPhone" [href]="'tel:' + contact().phone">{{ contact().phone }}</a>
  </div>
</section>

<button
  class="menuButton"
  type="button"
  aria-label="Contact options"
  [attr.aria-expanded]="isMenuOpen()"
  (click)="toggleMenu($event)"
></button>
